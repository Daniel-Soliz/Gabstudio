name: Build Gab Studio for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gabstudio-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production site
        run: |
          npm run build
          mv dist/app.html dist/index.html

      - name: Sync compiled site to repository root
        run: |
          rm -rf assets
          mkdir -p assets
          cp dist/index.html ./index.html
          cp -R dist/assets/. ./assets/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html assets

          if git diff --cached --quiet; then
            echo "Compiled site is already up to date."
          else
            git commit -m "chore: publish compiled Gab Studio [skip ci]"
            git push origin HEAD:main
          fi
